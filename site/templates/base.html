<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
<meta name="description" content="{% block description %}{% endblock %}">
{%- if noindex %}
<meta name="robots" content="noindex, nofollow">
{%- endif %}
<link rel="stylesheet" href="/assets/style.css">
{%- block head %}{% endblock %}
</head>
<body>
<header class="masthead"><div class="wrap">
  <a class="logo" href="/">幼兒園履歷</a>
  <span class="tagline">幼兒園與托嬰中心的公開紀錄</span>
  <nav>
    <a href="/">地圖</a>
    <a href="/about.html">關於這個站</a>
  </nav>
</div></header>

<main>{% block main %}{% endblock %}</main>

<footer class="sitefoot"><div class="wrap">
  <p>裁罰資料來自教育部全國教保資訊網與衛生福利部社會及家庭署違反兒少法裁罰專區，
     機構主檔與座標取自 kiang 的開放資料（MIT）。</p>
  <p>本站不公開自然人裁罰紀錄，公文所載姓名一律遮罩。資料如與主管機關公告不符，以主管機關為準。</p>
  <p class="stamp">資料更新日 {{ as_of }}</p>
</div></footer>
</body>
</html>
