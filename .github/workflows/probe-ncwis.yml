# 一次性探測：托育媒合平臺（ncwisweb.sfaa.gov.tw）擋不擋境外 IP？
#
# 背景：教保網（ap.ece.moe.edu.tw）封鎖境外 IP，所以那一軌只能跑在 old-mini。
# 托嬰主檔爬蟲當初「預設在 old-mini 執行最保險」，但**從未實際從境外測過**。
# 若這站其實不擋，它就能搬到 Actions，old-mini 的責任只剩教保網一站。
#
# 用真的爬蟲跑最小範圍（連江縣、上限 3 家）——只有數次請求，且走完整流程
# （POST 查詢需要 _csrf 與 session cookie，光 GET 測不出來）。
# 寫進暫存目錄，不碰資料 repo。
#
# 註：帶 --limit 時尾端解析會因為「詳情快照不存在」而 exit 1，屬預期行為，
# 故判斷依據是 log 內容而非結束碼。
#
# 測完就刪；結論寫回 docs/06。

name: probe-ncwis

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Runner 的出口 IP（存證用）
        run: curl -sS --max-time 20 https://api.ipify.org || echo "取不到 IP"

      - name: 探測 ncwisweb
        run: |
          set +e
          mkdir -p /tmp/probe/data
          python3 crawler/ncwis_centers.py --data-dir /tmp/probe \
            --city 連江縣 --limit 3 2>&1 | tee /tmp/probe.log
          echo "---- 結束碼 ${PIPESTATUS[0]} ----"
          echo
          if grep -q "連江縣：" /tmp/probe.log; then
            echo "結論：**沒有擋境外 IP**，Actions 連得上、查詢流程走得通"
          else
            echo "結論：**連不上或被擋**，維持在 old-mini 執行"
          fi
