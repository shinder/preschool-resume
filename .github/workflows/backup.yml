# 裁罰公告每日備份（僅社家署）
#
# 教保網（ap.ece.moe.edu.tw）封鎖境外 IP，GitHub Actions（美國）連不上，
# 由本機 launchd 排程負責（見 scripts/local_backup.sh）。
#
# 平日：--new-only 增量（列表全掃、詳情只抓新出現的），控制 Actions 分鐘數。
# 週六：全量重抓，補上既有紀錄的內容變更與下架偵測所需的完整快照。
#
# 需要的設定（在 GitHub 上完成一次）：
#   1. 建立 private repo shinder/preschool-resume-data
#   2. 產生 SSH deploy key，公鑰加到 data repo（Allow write access）
#   3. 私鑰存入本 repo 的 Actions secret：DATA_REPO_SSH_KEY

name: backup

on:
  schedule:
    - cron: "30 21 * * 0-4,6" # UTC 週六至週四 21:30 ＝ 台北週日至週五 05:30：增量
    - cron: "30 21 * * 5"     # UTC 週五 21:30 ＝ 台北週六 05:30：全量
  workflow_dispatch:
    inputs:
      mode:
        description: "備份模式"
        type: choice
        options: [new-only, full]
        default: new-only

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout 爬蟲程式碼
        uses: actions/checkout@v5

      - name: Checkout 資料 repo
        uses: actions/checkout@v5
        with:
          repository: shinder/preschool-resume-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data

      - name: 決定備份模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "30 21 * * 5" ]; then
            MODE="full"
          else
            MODE="new-only"
          fi
          echo "flag=$([ "$MODE" = "new-only" ] && echo --new-only)" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: 執行備份（社家署）
        run: |
          set +e
          python3 crawler/sfaa_crc.py --data-dir data ${{ steps.mode.outputs.flag }}
          echo "SFAA=$?" >> "$GITHUB_ENV"
          exit 0

      - name: 提交資料 repo（含心跳檔，供 watchdog 檢查）
        run: |
          mkdir -p data/status
          printf '{"date": "%s", "exit": %d}\n' "$(TZ=Asia/Taipei date +%F)" "${SFAA:-1}" > data/status/sfaa_backup.json
          cd data
          git add -A
          git config user.name "backup-bot"
          git config user.email "shinder.lin@gmail.com"
          if git diff --cached --quiet; then
            echo "無任何變更（同日重跑）"
          elif git diff --cached --quiet -- . ':!status'; then
            git commit -m "心跳 $(TZ=Asia/Taipei date +%F)（sfaa）"
            git push
          else
            git commit -m "備份 $(TZ=Asia/Taipei date +%F)（${{ steps.mode.outputs.mode }}）"
            git push
          fi

      - name: 回報爬蟲失敗
        run: |
          [ "$SFAA" = "0" ] || echo "::error::sfaa_crc.py exit=$SFAA"
          [ "$SFAA" = "0" ]
