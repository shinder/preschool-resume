# 免費地圖建置與部署（工程執行計劃 6.6）
#
# 排在 diff（old-mini，台北 08:30）之後、watchdog（台北 09:30）之前，
# 讓當天的新事件當天上站。
#
# 這條管線不碰政府網站，全部資料來自資料 repo 與 GitHub 上的 kiang 開放資料，
# 所以不受教保網封鎖境外 IP 的限制，可以留在 Actions。
#
# 需要的設定（在 GitHub 上完成一次）：
#   1. secrets.DATA_REPO_SSH_KEY   已存在（備份用的那把，需寫入權限）
#   2. secrets.CLOUDFLARE_API_TOKEN  權限：Workers Scripts 編輯
#   3. secrets.CLOUDFLARE_ACCOUNT_ID
#   4. ggggg.app 這個 zone 要在同一個 Cloudflare 帳號下——wrangler 會自動建
#      preschool.ggggg.app 的 DNS 記錄與憑證（wrangler.jsonc 的 custom_domain）
#   5. vars.SITE_BASE_URL（選用）覆寫 sitemap 與 canonical 用的網址；
#      未設定時用 site/build.py 的預設 https://preschool.ggggg.app

name: site

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 ＝ 台北 09:00，diff 跑完之後
  workflow_dispatch:
    inputs:
      index:
        description: "開放搜尋引擎索引（6b 才用；預設維持 noindex）"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: Checkout 資料 repo
        uses: actions/checkout@v5
        with:
          repository: shinder/preschool-resume-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data
          sparse-checkout: |
            data
            raw/kiang
            status

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 6.1 機構主檔
        run: python3 site/institutions.py --data-dir data

      - name: 6.2 裁罰↔機構對照
        run: python3 site/match.py --data-dir data

      - name: 提交主檔與對照結果
        run: |
          cd data
          git add -A
          git config user.name "site-bot"
          git config user.email "shinder.lin@gmail.com"
          git diff --cached --quiet || {
            git commit -m "機構主檔與對照 $(TZ=Asia/Taipei date +%F)"
            git push
          }

      - name: 6.3 公開層投影
        run: python3 site/public_data.py --data-dir data --out build/public

      - name: 6.4 建站
        env:
          BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          python3 site/build.py \
            --public build/public --out build/site \
            ${BASE_URL:+--base-url "$BASE_URL"} \
            ${{ inputs.index && '--index' || '' }}

      # v3 預設裝 wrangler 3.90.0，那個版本還不支援「只有 assets、沒有 main」的
      # 純靜態資產 Worker，會在認證之前就以 "Missing entry-point" 失敗
      # （2026-08-10 首次排程實際踩到）。v4 的預設 wranglerVersion 是 "4"。
      # 要退版之前先確認 wrangler.jsonc 是否仍然沒有 main。
      - name: 部署至 Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 寫入心跳檔（供 watchdog 檢查）
        if: always()
        run: |
          # 用 shell 判斷成敗，不要用 Actions 運算式的「and 0 or 1」寫法：
          # 運算式裡 0 是 falsy，成功時先得到 0、再掉進 or 分支拿到 1，
          # 於是心跳不論成敗永遠寫 1，watchdog 永遠紅。
          # （2026-08-10 首次部署成功才發現。註解裡也不能寫出那個運算式字面，
          #  Actions 連 run 區塊的註解都會求值。）
          RC=0
          [ "${{ job.status }}" = "success" ] || RC=1
          mkdir -p data/status
          printf '{"date": "%s", "exit": %d}\n' \
            "$(TZ=Asia/Taipei date +%F)" "$RC" > data/status/site.json
          cd data
          git add status
          git diff --cached --quiet || {
            git commit -m "心跳 $(TZ=Asia/Taipei date +%F)（site）"
            git push
          }
