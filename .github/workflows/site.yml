# 免費地圖建置與部署（工程執行計劃 6.6）
#
# 由 diff 完成後觸發（workflow_run），不再自排 cron。
#
# 原本兩軌各自排 cron（diff 台北 08:30、本軌 09:00），靠 30 分鐘的時間差保證
# 順序。但 Actions 的排程延遲是隨機的而且不小——2026-08-12 實測 diff 延遲
# 2h34m、site 延遲 2h17m，30 分鐘的緩衝被吃到只剩 13 分。一旦反轉，site 會拿
# 昨天的事件檔建站，而兩軌心跳都是今天的，watchdog 看不出來——靜默錯誤。
# 改成依賴觸發之後，順序由事件保證，不再靠猜時間。
#
# 附帶效果：diff 失敗（解析錯誤、removed 異常量警戒）時本軌整個不跑，符合
# 「寧可不更新，也不要用舊資料建出看起來很新的站」。
#
# 注意 workflow_run 事件下 checkout 拿到的是「觸發本次執行的那個 commit」，
# 也就是 diff 開跑時的 main；diff 執行期間推的新 commit 要等下一輪才生效。
#
# 這條管線不碰政府網站，全部資料來自資料 repo 與 GitHub 上的 kiang 開放資料，
# 所以不受教保網封鎖境外 IP 的限制，可以留在 Actions。
#
# 需要的設定（在 GitHub 上完成一次）：
#   1. secrets.DATA_REPO_SSH_KEY   已存在（備份用的那把，需寫入權限）
#   2. secrets.CLOUDFLARE_API_TOKEN  權限：帳戶層 Workers Scripts 編輯，外加
#      區域層「Workers 路由」編輯，而且該 token 的「區域資源」要含
#      wrangler.jsonc 裡自訂網域所在的 zone。換網域時這個範圍不會自己跟著
#      改——2026-08-23 遷到 shinder.work 後第一次排程就卡在這：10133 個資產
#      全部上傳成功、Worker 版本也上線了，最後更新 triggers 時才回
#      Authentication error 10000（token 的區域資源還鎖在 ggggg.app）。
#   3. secrets.CLOUDFLARE_ACCOUNT_ID
#   4. shinder.work 這個 zone 要在同一個 Cloudflare 帳號下——wrangler 會自動建
#      preschool.shinder.work 的 DNS 記錄與憑證（wrangler.jsonc 的 custom_domain）
#   5. vars.SITE_BASE_URL（選用）覆寫 sitemap 與 canonical 用的網址；
#      未設定時用 site/build.py 的預設 https://preschool.shinder.work

name: site

on:
  workflow_run:
    workflows: [diff] # 對應 diff.yml 的 name:，不是檔名
    types: [completed]
  workflow_dispatch:
    inputs:
      # 2026-08-22 解除 noindex（6b 之 6.7）：預設即開放索引。
      # workflow_run 事件沒有 inputs，這個布林在排程下永遠是空值（falsy），
      # 所以「預設開索引」的語意對每日排程與手動觸發都成立。
      noindex:
        description: "緊急回退：重新掛上 noindex（發現重大內容錯誤時用）"
        type: boolean
        default: false

jobs:
  build:
    # workflow_run 不分成敗都會送事件，成功才建站。
    # 手動觸發沒有 workflow_run 這層 context，要單獨放行。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 明列權限（repo 已公開，least privilege）：contents write 供公開層 dump
    # 的 gh release 用；checkout 本 repo 只需 read，被 write 涵蓋。
    # 資料 repo 的 checkout／push 走 ssh key，不吃這個 token。
    permissions:
      contents: write
    steps:
      - name: Checkout 程式碼
        uses: actions/checkout@v5

      - name: Checkout 資料 repo
        uses: actions/checkout@v5
        with:
          repository: shinder/preschool-resume-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data
          sparse-checkout: |
            data
            raw/kiang
            status

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 6.1 機構主檔
        run: python3 site/institutions.py --data-dir data

      - name: 6.2 裁罰↔機構對照
        run: python3 site/match.py --data-dir data

      - name: 提交主檔與對照結果
        run: |
          cd data
          git add -A
          git config user.name "site-bot"
          git config user.email "shinder.lin@gmail.com"
          git diff --cached --quiet || {
            git commit -m "機構主檔與對照 $(TZ=Asia/Taipei date +%F)"
            bash "$GITHUB_WORKSPACE/scripts/git_push_retry.sh"
          }

      - name: 6.3 公開層投影
        run: python3 site/public_data.py --data-dir data --out build/public

      - name: 6.4 建站
        env:
          BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          python3 site/build.py \
            --public build/public --out build/site \
            ${BASE_URL:+--base-url "$BASE_URL"} \
            ${{ inputs.noindex && '' || '--index' }}

      # v3 預設裝 wrangler 3.90.0，那個版本還不支援「只有 assets、沒有 main」的
      # 純靜態資產 Worker，會在認證之前就以 "Missing entry-point" 失敗
      # （2026-08-10 首次排程實際踩到）。v4 的預設 wranglerVersion 是 "4"。
      # 要退版之前先確認 wrangler.jsonc 是否仍然沒有 main。
      - name: 部署至 Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 公開層 dump 釋出（docs/09 待決 1 之決議：全開放）。rolling release
      # 「public-data」資產每日覆蓋，不逐日開 tag——penalties.json 本身就是
      # 累積資料集（含官方已下架、本站保留者），時點見 meta.json 的 as_of；
      # 逐日完整歷史在私有資料 repo 的 git 裡。四檔皆為 6.3 公開層產物，
      # 已過白名單重建、全欄位遮罩、姓名稽核三道防線，與站台同一口徑——
      # 絕不可改上傳資料 repo 的原始檔。放在部署成功之後：建站或部署失敗
      # 時不釋出，與「寧可不更新」一致。
      - name: 釋出公開層 dump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view public-data -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create public-data -R "$GITHUB_REPOSITORY" \
              --title "公開層資料（每日更新）" \
              --notes "建站用公開層四檔（institutions／penalties／aliases／meta），本站彙整部分以 CC BY 4.0 釋出，原始政府資料依政府資料開放授權條款第 1 版標示來源，詳見 README 授權節。資料時點見 meta.json 的 as_of。"
          gh release upload public-data build/public/*.json --clobber \
            -R "$GITHUB_REPOSITORY"

      - name: 寫入心跳檔（供 watchdog 檢查）
        if: always()
        run: |
          # 用 shell 判斷成敗，不要用 Actions 運算式的「and 0 or 1」寫法：
          # 運算式裡 0 是 falsy，成功時先得到 0、再掉進 or 分支拿到 1，
          # 於是心跳不論成敗永遠寫 1，watchdog 永遠紅。
          # （2026-08-10 首次部署成功才發現。註解裡也不能寫出那個運算式字面，
          #  Actions 連 run 區塊的註解都會求值。）
          RC=0
          [ "${{ job.status }}" = "success" ] || RC=1
          mkdir -p data/status
          printf '{"date": "%s", "exit": %d}\n' \
            "$(TZ=Asia/Taipei date +%F)" "$RC" > data/status/site.json
          cd data
          git add status
          git diff --cached --quiet || {
            git commit -m "心跳 $(TZ=Asia/Taipei date +%F)（site）"
            bash "$GITHUB_WORKSPACE/scripts/git_push_retry.sh"
          }
