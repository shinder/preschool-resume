# 靜默失敗告警：檢查各軌排程的心跳檔
#
# 每軌各自在資料 repo 寫 status/{job}.json（日期＋exit code）：
#
#   每日：
#     sfaa_backup：GitHub Actions 台北 05:30（backup.yml）
#     ece_backup ：old-mini systemd 06:30（scripts/local_backup.sh）
#     diff       ：GitHub Actions 台北 08:30（diff.yml；2026-08-10 由 old-mini 搬來）
#     site       ：GitHub Actions 台北 09:00（site.yml）
#   低頻：
#     ncwis      ：old-mini systemd 每週六 04:30（scripts/local_ncwis.sh）
#     ece_schools：old-mini systemd 每月 1 號 01:00（scripts/local_ece_schools.sh）
#
# 本 workflow 每日台北 09:30 檢查。每日軌要求「心跳是今天的」；低頻軌要求
# 「心跳在容許天數內」——否則週更、月更的工作每天都會誤報。
#
# 低頻軌本來完全不在監控內，於是「默默死掉沒人知道」：一個週更的工作停擺，
# 可能好幾個月後才從資料上看出來。容許天數留一次補跑的餘裕（週更 8 天、月更 35 天）。
#
# 任一不符即讓 workflow 失敗 → GitHub 原生失敗通知信，不依賴外部通知服務。
# 涵蓋：爬蟲失敗、解析失敗（diff 引擎 exit 1）、removed 異常量警戒、
# 建站閘門擋下（姓名外洩、逸出失敗、檔案數超限）、
# old-mini 離線或 timer 沒跑（心跳過期）。

name: watchdog

on:
  schedule:
    - cron: "30 1 * * *" # 台北 09:30
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 資料 repo（僅 status/）
        uses: actions/checkout@v5
        with:
          repository: shinder/preschool-resume-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data
          sparse-checkout: status

      - name: 檢查心跳
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          TODAY_S=$(date -d "$TODAY" +%s)
          FAIL=0

          # job:容許落後天數（0＝必須是今天）
          for spec in sfaa_backup:0 ece_backup:0 diff:0 site:0 ncwis:8 ece_schools:35; do
            job="${spec%%:*}"; grace="${spec##*:}"
            f="data/status/$job.json"
            if [ ! -f "$f" ]; then
              echo "::error::$job 心跳檔不存在（該軌可能從未成功寫入）"
              FAIL=1
              continue
            fi
            d=$(jq -r .date "$f")
            e=$(jq -r .exit "$f")
            age=$(( (TODAY_S - $(date -d "$d" +%s)) / 86400 ))
            if [ "$age" -gt "$grace" ]; then
              if [ "$grace" = "0" ]; then
                echo "::error::$job 心跳過期（最後寫入 $d）——排程沒跑或機器離線"
              else
                echo "::error::$job 心跳已 $age 天未更新（最後 $d，容許 $grace 天）——低頻排程沒跑"
              fi
              FAIL=1
            elif [ "$e" != "0" ]; then
              echo "::error::$job 最近一次執行失敗（$d，exit=$e），詳見該軌 log"
              FAIL=1
            fi
          done

          if [ "$FAIL" = "0" ]; then
            echo "各軌心跳正常（$TODAY）"
          fi
          exit $FAIL
