# 靜默失敗告警：檢查四軌排程的心跳檔
#
# 四軌各自在資料 repo 寫 status/{job}.json（日期＋exit code）：
#   sfaa_backup：GitHub Actions 台北 05:30（backup.yml）
#   ece_backup ：old-mini systemd 06:30（scripts/local_backup.sh）
#   diff       ：old-mini systemd 08:30（scripts/local_diff.sh）
#   site       ：GitHub Actions 台北 09:00（site.yml）
#
# 本 workflow 每日台北 09:30 檢查心跳「是今天的且 exit=0」，
# 任一不符即讓 workflow 失敗 → GitHub 原生失敗通知信。
# 涵蓋：爬蟲失敗、解析失敗（diff 引擎 exit 1）、removed 異常量警戒、
# 建站閘門擋下（姓名外洩、逸出失敗、檔案數超限）、
# old-mini 離線或 timer 沒跑（心跳過期）。

name: watchdog

on:
  schedule:
    - cron: "30 1 * * *" # 台北 09:30
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout 資料 repo（僅 status/）
        uses: actions/checkout@v5
        with:
          repository: shinder/preschool-resume-data
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data
          sparse-checkout: status

      - name: 檢查心跳
        run: |
          TODAY=$(TZ=Asia/Taipei date +%F)
          FAIL=0
          for job in sfaa_backup ece_backup diff site; do
            f="data/status/$job.json"
            if [ ! -f "$f" ]; then
              echo "::error::$job 心跳檔不存在（該軌可能從未成功寫入）"
              FAIL=1
              continue
            fi
            d=$(jq -r .date "$f")
            e=$(jq -r .exit "$f")
            if [ "$d" != "$TODAY" ]; then
              echo "::error::$job 心跳過期（最後寫入 $d）——排程沒跑或機器離線"
              FAIL=1
            elif [ "$e" != "0" ]; then
              echo "::error::$job 今日執行失敗（exit=$e），詳見該軌 log"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "0" ]; then
            echo "四軌心跳正常（$TODAY）"
          fi
          exit $FAIL
